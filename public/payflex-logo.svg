  <!-- Typography -->
  <text x="102" y="52" font-family="system-ui, -apple-system, sans-serif" font-size="32" font-weight="900" fill="#111827" letter-spacing="-1">Pay</text>
  <text x="156" y="52" font-family="system-ui, -apple-system, sans-serif" font-size="32" font-weight="900" fill="#f06449" letter-spacing="-1">Flex</text>
