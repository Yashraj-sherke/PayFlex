<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  <defs>
    <radialGradient id="ipBg" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0b0f19"/>
    </radialGradient>
    <linearGradient id="potBody" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#475569"/>
      <stop offset="50%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
  </defs>
  <rect width="600" height="600" rx="28" fill="url(#ipBg)"/>
  <!-- Pot Body -->
  <rect x="180" y="210" width="240" height="230" rx="28" fill="url(#potBody)" stroke="#94a3b8" stroke-width="3"/>
  <!-- Pot Lid & Handle -->
  <ellipse cx="300" cy="210" rx="120" ry="30" fill="#334155" stroke="#94a3b8" stroke-width="3"/>
  <rect x="250" y="145" width="100" height="45" rx="10" fill="#0f172a" stroke="#64748b" stroke-width="2"/>
  <line x1="270" y1="190" x2="270" y2="200" stroke="#94a3b8" stroke-width="4"/>
  <line x1="330" y1="190" x2="330" y2="200" stroke="#94a3b8" stroke-width="4"/>
  <!-- Digital Control Display -->
  <rect x="230" y="270" width="140" height="120" rx="12" fill="#020617" stroke="#38bdf8" stroke-width="2"/>
  <text x="300" y="325" fill="#38bdf8" font-family="monospace" font-size="28" font-weight="900" text-anchor="middle">12:30</text>
  <circle cx="260" cy="360" r="10" fill="#ef4444"/>
  <circle cx="300" cy="360" r="10" fill="#22c55e"/>
  <circle cx="340" cy="360" r="10" fill="#3b82f6"/>
  <text x="300" y="525" fill="#93c5fd" font-family="system-ui, sans-serif" font-size="18" font-weight="700" text-anchor="middle" letter-spacing="2">INSTANT POT PRO 10-IN-1</text>
</svg>