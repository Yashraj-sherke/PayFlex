<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  <defs>
    <radialGradient id="rmBg" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </radialGradient>
    <linearGradient id="alum" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="50%" stop-color="#94a3b8"/>
      <stop offset="100%" stop-color="#64748b"/>
    </linearGradient>
  </defs>
  <rect width="600" height="600" rx="28" fill="url(#rmBg)"/>
  <!-- Luggage Body with Grooves -->
  <rect x="200" y="110" width="200" height="340" rx="20" fill="url(#alum)" stroke="#f1f5f9" stroke-width="3"/>
  <!-- Iconic Ribbed Grooves -->
  <line x1="225" y1="130" x2="225" y2="430" stroke="#475569" stroke-width="3"/>
  <line x1="245" y1="130" x2="245" y2="430" stroke="#475569" stroke-width="3"/>
  <line x1="265" y1="130" x2="265" y2="430" stroke="#475569" stroke-width="3"/>
  <line x1="285" y1="130" x2="285" y2="430" stroke="#475569" stroke-width="3"/>
  <line x1="315" y1="130" x2="315" y2="430" stroke="#475569" stroke-width="3"/>
  <line x1="335" y1="130" x2="335" y2="430" stroke="#475569" stroke-width="3"/>
  <line x1="355" y1="130" x2="355" y2="430" stroke="#475569" stroke-width="3"/>
  <line x1="375" y1="130" x2="375" y2="430" stroke="#475569" stroke-width="3"/>
  <!-- Corner Protectors -->
  <path d="M 200 140 L 200 110 L 230 110" fill="none" stroke="#0f172a" stroke-width="8"/>
  <path d="M 400 140 L 400 110 L 370 110" fill="none" stroke="#0f172a" stroke-width="8"/>
  <!-- Wheels -->
  <circle cx="225" cy="465" r="14" fill="#0f172a" stroke="#94a3b8" stroke-width="2"/>
  <circle cx="375" cy="465" r="14" fill="#0f172a" stroke="#94a3b8" stroke-width="2"/>
  <!-- Telescopic Handle -->
  <rect x="255" y="60" width="90" height="50" rx="6" fill="none" stroke="#0f172a" stroke-width="6"/>
  <text x="300" y="535" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="18" font-weight="700" text-anchor="middle" letter-spacing="2">RIMOWA CLASSIC CABIN</text>
</svg>