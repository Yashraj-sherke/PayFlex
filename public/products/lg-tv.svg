<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" fill="none">
  <!-- Screen Frame -->
  <rect x="100" y="100" width="600" height="340" rx="8" fill="#0f172a" stroke="#334155" stroke-width="6"/>
  <!-- Vivid OLED Wallpaper -->
  <defs>
    <linearGradient id="oled-screen" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0%" stop-color="#1e1b4b"/>
      <stop offset="40%" stop-color="#701a75"/>
      <stop offset="70%" stop-color="#f97316"/>
      <stop offset="100%" stop-color="#fbbf24"/>
    </linearGradient>
  </defs>
  <rect x="110" y="110" width="580" height="320" rx="4" fill="url(#oled-screen)"/>
  <!-- TV Stand -->
  <rect x="340" y="440" width="120" height="30" rx="4" fill="#64748b"/>
  <rect x="280" y="470" width="240" height="8" rx="4" fill="#94a3b8"/>
</svg>