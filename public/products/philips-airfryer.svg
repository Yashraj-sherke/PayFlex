  <rect x="180" y="120" width="240" height="360" rx="50" fill="#1e293b"/>
  <!-- Gloss Top -->
  <ellipse cx="300" cy="150" rx="110" ry="25" fill="#334155"/>
  <!-- Digital LED Display Panel -->
  <rect x="230" y="190" width="140" height="70" rx="14" fill="#0f172a" stroke="#475569" stroke-width="2"/>
  <text x="300" y="235" font-family="sans-serif" font-size="24" font-weight="bold" fill="#38bdf8" text-anchor="middle">200°C</text>
  <!-- Basket Handle -->
  <rect x="220" y="300" width="160" height="140" rx="20" fill="#0f172a"/>
  <rect x="285" y="340" width="30" height="70" rx="10" fill="#64748b"/>
