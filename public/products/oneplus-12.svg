      <stop offset="0%" stop-color="#2a382e"/>
      <stop offset="100%" stop-color="#0c140e"/>
    </radialGradient>
    <linearGradient id="emeraldGlass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2d5238"/>
      <stop offset="50%" stop-color="#193522"/>
      <stop offset="100%" stop-color="#0f2215"/>
    </linearGradient>
  </defs>
  <rect width="600" height="600" rx="28" fill="url(#opBg)"/>
  <!-- Phone body -->
  <rect x="200" y="80" width="200" height="420" rx="36" fill="url(#emeraldGlass)" stroke="#4ade80" stroke-width="2.5" filter="drop-shadow(0 20px 30px rgba(0,0,0,0.7))"/>
  <!-- Circular Camera Island -->
  <circle cx="270" cy="180" r="55" fill="#142118" stroke="#52795d" stroke-width="3"/>
  <circle cx="250" cy="165" r="16" fill="#080c09" stroke="#34d399" stroke-width="2"/>
  <circle cx="290" cy="165" r="16" fill="#080c09" stroke="#34d399" stroke-width="2"/>
  <circle cx="270" cy="205" r="16" fill="#080c09" stroke="#34d399" stroke-width="2"/>
  <!-- Hasselblad 'H' branding subtle -->
  <text x="345" y="185" fill="#94a3b8" font-family="system-ui" font-size="14" font-weight="900">H</text>
  <!-- Screen highlight reflection -->
  <path d="M 215 95 L 385 95 C 390 95 390 130 385 150 L 215 290 Z" fill="white" opacity="0.06"/>
  <!-- Bottom branding -->
  <text x="300" y="540" fill="#86efac" font-family="system-ui, sans-serif" font-size="18" font-weight="700" text-anchor="middle" letter-spacing="3">ONEPLUS 12 5G</text>
